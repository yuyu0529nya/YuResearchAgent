[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yu-research-agent"
version = "0.4.0"
description = "Evidence-grounded multi-agent deep research system"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "yuyu0529nya", email = "yuyu0529nya@gmail.com"},
]
keywords = ["deep-research", "agent", "llm", "evidence", "citation", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0",
    "numpy>=1.24",
    "aiohttp>=3.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "ddgs>=9.0",
]

[project.optional-dependencies]
web = [
    "gradio>=4.0",
]
semantic = [
    "sentence-transformers>=2.5",
]
analysis = [
    "datasets>=2.14",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
observability = [
    "langsmith>=0.1.0",
]
serve = [
    "vllm>=0.4.0",
]
train = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.14",
    "trl>=0.16",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "wandb",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "flake8",
]
all = [
    "gradio>=4.0",
    "sentence-transformers>=2.5",
    "datasets>=2.14",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "langsmith>=0.1.0",
    "vllm>=0.4.0",
    "torch>=2.0",
    "transformers>=4.40",
    "trl>=0.16",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "wandb",
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "flake8",
]

[project.scripts]
# 命令行快捷入口
run-research = "scripts.run_single:main"
run-eval = "scripts.run_eval:main"
run-ablation = "scripts.run_ablation:main"
run-benchmark = "scripts.run_benchmark:cli"
run-judge = "scripts.run_judge:main"
run-evolution = "scripts.run_evolution:main"
replay-evidence = "scripts.replay_evidence:main"

[project.urls]
Homepage = "https://github.com/yuyu0529nya/YuResearchAgent"
Repository = "https://github.com/yuyu0529nya/YuResearchAgent"
Issues = "https://github.com/yuyu0529nya/YuResearchAgent/issues"

[tool.setuptools.packages.find]
include = ["src*", "evaluation*", "scripts*", "configs*"]
exclude = ["scripts.grpo_poc.results*"]
namespaces = true

[tool.setuptools.package-data]
configs = ["*.yaml", "**/*.yaml"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-q"
